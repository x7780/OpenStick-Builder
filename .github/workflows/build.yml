name: 构建

on:
  workflow_dispatch:
    inputs:
      board:
        description: '硬件型号（yiming-uz801v3 / thwc-uf896=UF896 / thwc-ufi001c=UFIxxx / jz01-45-v33=JZxxx / fy-mf800=MF800 / generic-m9s=M9S / generic-mf68e=MF68E / generic-uf02=UF02 / gexing-sp970=SP970 / gexing-sp970v10=SP970V10 / gexing-sp970v11=SP970V11 / thwc-jz02v10=JZ02V10 / thwc-qrzl903=QRZL903 / thwc-w001=W001 / ufi-mf32=MF32 / xinxun-wf2=WF2）'
        required: true
        default: 'thwc-ufi001c'
        type: choice
        options:
          - yiming-uz801v3
          - thwc-uf896
          - thwc-ufi001c
          - jz01-45-v33
          - fy-mf800
          - generic-m9s
          - generic-mf68e
          - generic-uf02
          - gexing-sp970
          - gexing-sp970v10
          - gexing-sp970v11
          - thwc-jz02v10
          - thwc-qrzl903
          - thwc-w001
          - ufi-mf32
          - xinxun-wf2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 修复 lk2nd 符号链接
        run: |
          rm -f src/lk2nd/lk2nd/device/dts/include/dt-bindings
          ln -s ../../../include/dt-bindings src/lk2nd/lk2nd/device/dts/include/dt-bindings
          rm -f src/lk2nd/lk2nd/include/dt-bindings/lk2nd/key-codes.h
          ln -s ../../../../include/dev/key-codes.h src/lk2nd/lk2nd/include/dt-bindings/lk2nd/key-codes.h

      - name: 安装依赖
        run: sudo sh -e scripts/install_deps.sh

      - name: 编译 hyp 和 aboot 固件
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: 提取 MSM8916 固件
        run: sudo sh -e scripts/extract_fw.sh

      - name: 创建根文件系统
        run: sudo sh -e scripts/alpine_rootfs.sh

      - name: 设置硬件设备树
        run: |
          # 更新 extlinux.conf 使用正确的设备树
          sudo sed -i 's|fdt /dtbs/qcom/msm8916-.*\.dtb|fdt /dtbs/qcom/msm8916-${{ github.event.inputs.board }}.dtb|' \
            rootfs/boot/extlinux/extlinux.conf
          echo "extlinux.conf 已更新："
          cat rootfs/boot/extlinux/extlinux.conf

          # 只保留当前设备需要的 dtb，删除其余所有 msm8916 dtb
          sudo find rootfs/boot/dtbs/qcom/ -name "*.dtb" \
            ! -name "msm8916-${{ github.event.inputs.board }}.dtb" \
            -delete
          echo "保留的 dtb 文件："
          ls rootfs/boot/dtbs/qcom/

          # 重新打包 tgz，确保 build_images.sh 使用更新后的内容
          sudo tar cpzf alpine_rootfs.tgz \
            --exclude="root/*" \
            --exclude="usr/bin/qemu-aarch64-static" \
            -C rootfs .

      - name: 打包镜像
        run: sudo sh -e scripts/build_images.sh

      - name: 复制刷机脚本
        run: sudo cp -r 刷机脚本/. files/

      - name: 打包为 zip
        run: |
          cd files
          zip -r ../openstick-alpine-${{ github.event.inputs.board }}.zip .
          cd ..
          ls -lh openstick-alpine-${{ github.event.inputs.board }}.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openstick-alpine-${{ github.event.inputs.board }}
          path: files/
          retention-days: 7

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.board }}-${{ github.run_number }}
          name: "OpenStick Alpine | ${{ github.event.inputs.board }} (${{ github.event.inputs.board == 'thwc-uf896' && 'UF896' || github.event.inputs.board == 'thwc-ufi001c' && 'UFIxxx' || github.event.inputs.board == 'jz01-45-v33' && 'JZxxx' || github.event.inputs.board == 'fy-mf800' && 'MF800' || github.event.inputs.board == 'generic-m9s' && 'M9S' || github.event.inputs.board == 'generic-mf68e' && 'MF68E' || github.event.inputs.board == 'generic-uf02' && 'UF02' || github.event.inputs.board == 'gexing-sp970' && 'SP970' || github.event.inputs.board == 'gexing-sp970v10' && 'SP970V10' || github.event.inputs.board == 'gexing-sp970v11' && 'SP970V11' || github.event.inputs.board == 'thwc-jz02v10' && 'JZ02V10' || github.event.inputs.board == 'thwc-qrzl903' && 'QRZL903' || github.event.inputs.board == 'thwc-w001' && 'W001' || github.event.inputs.board == 'ufi-mf32' && 'MF32' || github.event.inputs.board == 'xinxun-wf2' && 'WF2' || github.event.inputs.board }}) | #${{ github.run_number }}"
          body: |
            ## 📦 OpenStick Alpine Linux 固件

            | 项目 | 内容 |
            |------|------|
            | 🔧 硬件型号 | `${{ github.event.inputs.board }}` (${{ github.event.inputs.board == 'thwc-uf896' && 'UF896' || github.event.inputs.board == 'thwc-ufi001c' && 'UFIxxx' || github.event.inputs.board == 'jz01-45-v33' && 'JZxxx' || github.event.inputs.board == 'fy-mf800' && 'MF800' || github.event.inputs.board == 'generic-m9s' && 'M9S' || github.event.inputs.board == 'generic-mf68e' && 'MF68E' || github.event.inputs.board == 'generic-uf02' && 'UF02' || github.event.inputs.board == 'gexing-sp970' && 'SP970' || github.event.inputs.board == 'gexing-sp970v10' && 'SP970V10' || github.event.inputs.board == 'gexing-sp970v11' && 'SP970V11' || github.event.inputs.board == 'thwc-jz02v10' && 'JZ02V10' || github.event.inputs.board == 'thwc-qrzl903' && 'QRZL903' || github.event.inputs.board == 'thwc-w001' && 'W001' || github.event.inputs.board == 'ufi-mf32' && 'MF32' || github.event.inputs.board == 'xinxun-wf2' && 'WF2' || github.event.inputs.board }}) |
            |  构建编号 | #${{ github.run_number }} |
            | 🐧 系统 | Alpine Linux v3.20 |
            | 📡 内核 | postmarketos-qcom-msm8916 |

            ## 🔑 登录信息

            | 项目 | 账号 | 密码 |
            |------|------|------|
            | 用户名 | root | root |


            ## 🌐 网络信息

            **USB 网络（数据线连接电脑）**

            | 项目 | 内容 |
            |------|------|
            | 设备 IP | `192.168.42.1` |
            | SSH 连接 | `ssh root@192.168.42.1` |

            **WiFi 热点**

            | 项目 | 内容 |
            |------|------|
            | SSID | `Openstick` |
            | 密码 | `openstick` |
            | 设备 IP | `192.168.43.1` |
            | SSH 连接 | `ssh root@192.168.43.1` |

            > ⚠️ 刷机有风险，请确认硬件型号与本固件一致再操作！
          files: openstick-alpine-${{ github.event.inputs.board }}.zip
          draft: false
          prerelease: false
